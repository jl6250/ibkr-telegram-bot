name: IBKR Daily Telegram Report

on:
  schedule:
    # 国际标准时间 UTC 22:30 (对应北京时间次日早上 06:30，美股与欧股均已收盘清算)
    # 周一至周五 UTC 对应周二至周六晨间推送交易日报告
    - cron: '5 6 * * 1-6'
  workflow_dispatch: # 支持在 GitHub 页面随时手动一键触发测试

jobs:
  run-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Daily Report
        env:
          IBKR_TOKEN: ${{ secrets.IBKR_TOKEN }}
          IBKR_QUERY_ID: ${{ secrets.IBKR_QUERY_ID }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: python main.py
